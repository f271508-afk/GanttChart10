</div>
<div class="main"><div class="left" id="left"></div><div class="right"><div class="g" id="gantt"></div></div></div>
<div class="scw" id="scw"><div class="scl"><canvas id="scc1" style="display:block"></canvas></div><div class="scr" id="scr"><canvas id="scc" style="display:block"></canvas></div></div>

<details open><summary>休假日設定(工作天模式扣除，圖上以紅底標示)</summary>

<div style="color:var(--mu);margin-top:4px">每行一筆，格式：2027/2/5 或 2027/2/5-2027/2/10。週休設定另外計算。</div></details>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
const DAY=864e5,MW=84,RH=38;
const U=(y,m,d)=>Date.UTC(y,m-1,d)/DAY;

const dow=n=>new Date(n*DAY).getUTCDay();
const T=(n,a,b,col)=>({n,s:a,e:b,c:col});
const mkSample=()=>{const S={mode:'cal',rest:2,incl:false,
hol:'',
man:{},
t:[T('室內點交拆除','2026-09-08','2026-11-06','#f48fb1'),T('外牆切割打石(變使)','2026-12-10','2027-01-30','#f48fb1'),T('外牆裝修(變使)','2027-02-01','2027-04-01','#14a7e0'),T('景觀植栽優化','2027-01-01','2027-01-15','#1aa35a'),T('BF地坪油漆修整','2027-04-01','2027-05-30','#c0641c'),T('機空消配管','2026-11-10','2027-05-30','#e62117'),T('室內隔間','2026-11-15','2027-04-30','#8eaadb'),T('浴廁防水','2027-01-10','2027-03-15','#8eaadb'),T('浴廁壁地磁磚','2027-02-10','2027-03-30','#8eaadb'),T('客房木作油漆','2027-03-01','2027-04-30','#8eaadb'),T('公設木作油漆','2027-04-01','2027-05-15','#8eaadb'),T('地坪SPC,地毯','2027-05-01','2027-05-31','#8eaadb'),T('衛浴設備','2027-06-01','2027-06-15','#8eaadb'),T('燈具設備','2027-06-05','2027-06-20','#8eaadb'),T('活動傢俱','2027-06-05','2027-06-20','#8eaadb'),T('清潔驗收移交','2027-06-21','2027-06-30','#8eaadb')]};
[2,2,4,4,4,4,4,4,4,4,2,2,2].forEach((v,i)=>{const m=8+i;S.man[(m>12?2027:2026)+'-'+((m-1)%12+1)]=v});return S};
let PROJ={cur:0,list:[]};
try{const x=localStorage.getItem('sched2');if(x){const o=JSON.parse(x);if(o&&Array.isArray(o.list)&&o.list.length)PROJ=o}else{const y=localStorage.getItem('sched1');if(y)PROJ.list=[JSON.parse(y)]}}catch(e){}

let S=PROJ.list[PROJ.cur];

function holSet(){const h=new Set();S.hol.split('\n').forEach(l=>{const p=l.trim().split(/[-~–]/).map(x=>x.trim().split('/').map(Number)).filter(a=>a.length==3&&a[0]);if(!p.length)return;const a=U(...p[0]),b=p.length>1?U(...p[1]):a;for(let i=a;i<=b;i++)h.add(i)});cnyR().forEach(([a,b])=>{for(let i=a;i<=b;i++)h.add(i)});return h}
let H=new Set();
const isRest=n=>{const w=dow(n);return S.rest==2?(w==0||w==6):S.rest==1?w==0:false};
const isWork=n=>!isRest(n)&&!H.has(n);
function dur(s,e){if(e<s)return 0;const a=S.incl?s:s+1;if(S.mode=='cal')return e-a+1;let c=0;for(let i=a;i<=e;i++)if(isWork(i))c++;return c}
function endOf(s,d){if(d<=0)return s;if(S.mode=='cal')return S.incl?s+d-1:s+d;let c=0,i=s;if(S.incl&&isWork(s))c=1;while(c<d){i++;if(isWork(i))c++;if(i-s>20000)break}return i}

const pad2=n=>String(n).padStart(2,'0');
function fd(s){const[a,b,c]=s.split('-');return S.roc!==false?(+a-1911)+'/'+b+'/'+c:a+'/'+b+'/'+c}
function parseD(s){const m=String(s).match(/(\d{2,4})\D+(\d{1,2})\D+(\d{1,2})/);if(!m)return null;let y=+m[1];if(y<1900)y+=1911;const t=y+'-'+pad2(+m[2])+'-'+pad2(+m[3]);return iso(U(y,+m[2],+m[3]))===t?t:null}
function di(v,i,f,al){return S.roc!==false?`<span class="dw"><input type="text" inputmode="numeric" style="width:94px" placeholder="115/09/08" value="${v?fd(v):''}" data-i="${i}" data-f="${f}" aria-label="${al}"${LK(f,i)}><label class="cal" title="日曆選擇">📅<input type="date" value="${v||''}" data-i="${i}" data-f="${f}" aria-label="${al}日曆"${LK(f,i)}></label></span>`:`<input type="date" value="${v||''}" data-i="${i}" data-f="${f}" aria-label="${al}"${LK(f,i)}>`}
function ink(h){const n=parseInt(String(h).slice(1),16)||0,r=n>>16,g=n>>8&255,b=n&255;return (r*299+g*587+b*114)/1000>150?'#000':'#fff'}
function yrRow(){const g=GM;let h='',i=0;while(i<g.cs.length){const y=new Date(g.cs[i]*DAY).getUTCFullYear();let j=i;while(j<g.cs.length&&new Date(g.cs[j]*DAY).getUTCFullYear()==y)j++;h+=`<div style="width:${(j-i)*g.CW}px">${S.roc!==false?y-1911:y}年</div>`;i=j}return `<div class="mh yr" style="width:${g.cs.length*g.CW}px">${h}</div>`}
function sData(){
 const tk=S.t.filter(t=>t.s&&t.e);if(!tk.length)return null;
 const wt=t=>Math.max(dur(pd(t.s),pd(t.e)),1),W=tk.reduce((a,t)=>a+wt(t),0),ak=S.act?tk.filter(t=>t.as&&t.ae):[];
 const d0=Math.min(...tk.map(t=>pd(t.s)),...ak.map(t=>pd(t.as))),d1=Math.max(...tk.map(t=>pd(t.e)),...ak.map(t=>pd(t.ae)));
 const pg=(s,e,d)=>d<s?0:d>=e?1:(d-s+1)/(e-s+1),P=[],A=[],am=ak.length?Math.max(...ak.map(t=>pd(t.ae))):0;
 for(let d=d0;d<=d1;d++){let p=0,a=0;tk.forEach(t=>{p+=wt(t)*pg(pd(t.s),pd(t.e),d);if(ak.includes(t))a+=wt(t)*pg(pd(t.as),pd(t.ae),d)});P.push([d,p/W*100]);if(d<=am)A.push([d,a/W*100])}
 return{d0,d1,P,A:ak.length?A:null}}
const SF='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif',sf=(n,u)=>Math.round(n*u)+'px '+SF;
function headS(x,ox,oy,w,h,u,D,tt){
 x.save();x.translate(ox,oy);x.fillStyle='#fff';x.fillRect(0,0,w,h);x.textBaseline='middle';x.textAlign='left';x.fillStyle='#000';
 x.font=sf(16,u);x.fillText(tt||'工期 S 曲線（預定／實際累計進度，依工期加權）',10*u,14*u);
 if(!D){x.font=sf(14,u);x.fillText(tt?'尚無資料，請在「資金預估」列輸入每月金額':'尚無資料',10*u,40*u);x.restore();return}
 x.lineWidth=3*Math.max(u,1);x.strokeStyle='#1f5fbf';x.beginPath();x.moveTo(10*u,36*u);x.lineTo(40*u,36*u);x.stroke();x.fillStyle='#000';x.font=sf(14,u);x.fillText('預定',46*u,36*u);
 if(D.R){x.strokeStyle='#c26a00';x.beginPath();x.moveTo(200*u,36*u);x.lineTo(230*u,36*u);x.stroke();x.fillStyle='#000';x.fillText('修正',236*u,36*u)}
 if(D.A){x.strokeStyle=D.cA||'#d32f2f';x.beginPath();x.moveTo(100*u,36*u);x.lineTo(130*u,36*u);x.stroke();x.fillStyle='#000';x.fillText('實際',136*u,36*u)}
